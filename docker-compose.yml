# B 方案 · 一台服务器自建三件套（PG + Redis + Qdrant）
# 用法：docker compose up -d
# 生产部署前务必修改 POSTGRES_PASSWORD / REDIS_PASSWORD，并限定容器网络不对外暴露。
services:
  postgres:
    image: postgres:16-alpine
    container_name: twin-pg
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${PG_PASSWORD:-twin}
      POSTGRES_DB: twin
    # 4G 内存友好参数（8G 机器同样适用，个人规模足够；若想更激进可去掉 command 用默认）
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "work_mem=4MB"
    ports:
      - "127.0.0.1:5432:5432"   # 只绑定本机，应用与备份走本机回环
    volumes:
      - twin_pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: twin-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-twin}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - twin_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-twin}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: twin-qdrant
    # 个人数据量（见 README 容量论证）内存占用极小：1 万条 2048 维向量仅 ~80MB。
    # 4G 机器无需额外限制；若向量规模达数十万条再考虑加 deploy.resources.limits.memory: 1536m
    ports:
      - "127.0.0.1:6333:6333"   # 仅本机访问；如需远程调试再改绑定
    volumes:
      - twin_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6333/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  twin_pg_data:
  twin_redis_data:
  twin_qdrant_data:
