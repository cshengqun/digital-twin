<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 个人数字分身</title>
<style>
:root{--bg:#F6F4EF;--paper:#fff;--ink:#18202E;--ink2:#4A5263;--line:#E3DFD4;--accent:#2352E8;--accent-deep:#16338F;--err:#B23A3A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(12,21,38,.06);}
.card h1{font-size:22px;margin-bottom:4px;}
.card .sub{color:var(--ink2);font-size:13.5px;margin-bottom:24px;}
label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 6px;}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px;outline:none;transition:border-color .15s;}
input:focus{border-color:var(--accent);}
button{width:100%;margin-top:22px;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;}
button:hover{background:var(--accent-deep);}
button:disabled{opacity:.6;cursor:not-allowed;}
.err{color:var(--err);font-size:13px;margin-top:12px;min-height:18px;}
</style>
</head>
<body>
<div class="card">
  <h1>个人数字分身</h1>
  <div class="sub">登录后开始对话 · 单用户私有部署</div>
  <form id="form">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">登录</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
const form = document.getElementById('form');
const btn = document.getElementById('btn');
const err = document.getElementById('err');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: form.username.value, password: form.password.value})
    });
    if (res.ok) { location.href = '/'; return; }
    if (res.status === 429) { err.textContent = '尝试过于频繁，请稍后再试'; }
    else { err.textContent = '用户名或密码错误'; }
  } catch {
    err.textContent = '网络错误，请重试';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
